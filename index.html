<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>توقيع المستندات – جمعية صقيل لتنمية الشباب</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="brand-logo" viewBox="0 0 48 48" aria-hidden="true"><rect x="2" y="2" width="44" height="44" rx="12" fill="var(--navy)"/><path d="M13 31c4-1 6-9 9-9s1 7 4 7 4-4 6-4 2 2 4 2M13 36h22" fill="none" stroke="var(--on-accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div>
      <h1>توقيع المستندات</h1>
      <span>جمعية صقيل لتنمية الشباب</span>
    </div>
  </div>

  <div class="actions">
    <button id="btnUpload" class="btn primary" title="رفع ملف PDF">
      <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0-4 4m4-4 4 4M5 20h14"/></svg>رفع PDF</button>
    <button id="btnSign" class="btn" disabled>
      <svg viewBox="0 0 24 24"><path d="M3 17c3-1 4-6 6-6s1 5 3 5 3-3 5-3 2 2 4 2M4 21h16"/></svg>إضافة توقيع</button>
    <button id="btnStamp" class="btn" disabled>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg>إضافة الختم</button>
    <span class="sep"></span>
    <button id="btnUndo" class="btn ghost" disabled title="تراجع (Ctrl+Z)">
      <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg>تراجع</button>
    <button id="btnDelete" class="btn ghost" disabled title="حذف العنصر المحدد (Delete)">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>حذف العنصر المحدد</button>
    <span class="sep"></span>
    <button id="btnDownload" class="btn success" disabled>
      <svg viewBox="0 0 24 24"><path d="M12 4v12m0 0-4-4m4 4 4-4M5 20h14"/></svg>تنزيل PDF</button>
    <button id="btnNew" class="btn ghost" disabled>
      <svg viewBox="0 0 24 24"><path d="M14 3H6v18h12V7zM14 3v4h4M12 11v6M9 14h6"/></svg>مستند جديد</button>
  </div>
  <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>
</header>

<div class="subbar" id="subbar" hidden>
  <span class="docname" id="docName"></span>
  <div class="nav">
    <button class="icon" id="btnPrev" title="الصفحة السابقة">‹</button>
    <span>صفحة <input id="pageInput" type="number" min="1" value="1"> من <b id="pageCount">1</b></span>
    <button class="icon" id="btnNext" title="الصفحة التالية">›</button>
  </div>
  <div class="zoom">
    <button class="icon" id="btnZoomOut" title="تصغير">−</button>
    <span id="zoomLabel">100%</span>
    <button class="icon" id="btnZoomIn" title="تكبير">+</button>
    <button class="link" id="btnFit">ملاءمة العرض</button>
  </div>
</div>

<main id="viewer" class="viewer">
  <div id="empty" class="empty">
    <div class="drop">
      <svg viewBox="0 0 24 24"><path d="M14 3H6v18h12V7zM14 3v4h4M12 17v-6m0 0-3 3m3-3 3 3"/></svg>
      <h2>ارفع مستند PDF للبدء</h2>
      <p>اضغط على «رفع PDF» أو اسحب الملف وأفلته هنا</p>
      <button class="btn primary" id="btnUpload2">اختيار ملف</button>
      <small>يعمل الموقع على جهازك فقط — لا يُرفع أي ملف إلى الإنترنت</small>
    </div>
  </div>
  <div id="pages" class="pages"></div>
</main>

<div id="toast" class="toast" hidden></div>
<div id="busy" class="busy" hidden><div class="spinner"></div><span id="busyText">جارٍ التجهيز…</span></div>

<!-- نافذة التوقيع -->
<div id="sigModal" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h3>ارسم توقيعك</h3>
      <button class="icon" id="sigClose" title="إغلاق">×</button>
    </div>
    <div class="sig-wrap">
      <canvas id="sigCanvas"></canvas>
      <div class="sig-line"></div>
      <div class="sig-hint" id="sigHint">وقّع هنا بالماوس أو اللمس أو القلم</div>
    </div>
    <div class="sig-tools">
      <div class="colors">
        <span>اللون:</span>
        <button class="swatch active" data-color="#0b1f5c" style="--c:#0b1f5c" title="أزرق داكن"></button>
        <button class="swatch" data-color="#111111" style="--c:#111111" title="أسود"></button>
        <button class="swatch" data-color="#1d4ed8" style="--c:#1d4ed8" title="أزرق"></button>
      </div>
      <div class="widths">
        <span>السُّمك:</span>
        <input type="range" id="sigWidth" min="1.5" max="6" step="0.5" value="3">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="sigClear">مسح التوقيع</button>
      <button class="btn primary" id="sigApply" disabled>اعتماد التوقيع</button>
    </div>
  </div>
</div>

<!-- نافذة التأكيد -->
<div id="askModal" class="modal" hidden>
  <div class="modal-card small" role="alertdialog" aria-labelledby="askText">
    <div class="modal-body" id="askText"></div>
    <div class="modal-foot">
      <button class="btn ghost" id="askNo">إلغاء</button>
      <button class="btn primary" id="askYes">متابعة</button>
    </div>
  </div>
</div>

<script src="lib/pdf.min.js"></script>
<script src="lib/pdf.worker.min.js"></script>
<script src="lib/pdf-lib.min.js"></script>
<script src="app.js"></script>
</body>
</html>
